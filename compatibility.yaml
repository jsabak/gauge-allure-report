known_protocol_limits:
  - >-
    Gauge Core exits before starting reporters when a tag filter matches zero
    specifications.
  - >-
    Gauge final SuiteExecutionResult stores attempt count while live lifecycle
    events store a zero-based retry index.
  - >-
    Python and JavaScript runners may leave ProtoExecutionResult.errorType at
    ASSERTION for unexpected exceptions; diagnostics are classified
    conservatively.
