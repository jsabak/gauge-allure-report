name: Release

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed semantic-version release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish release artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve requested release tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-${RELEASE_EVENT_TAG:-${MANUAL_TAG:-$GITHUB_REF_NAME}}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: getgauge/setup-gauge@159e01e975eeae8bd1a097017590fefbc36e2d4e # audited 2026-08-07
        with:
          gauge-version: 1.6.35
      - name: Record reproducible build time
        run: |
          echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - name: Full Gauge and Allure conformance
        run: sh scripts/test-e2e.sh python
      - name: Cross-compile and verify exact Gauge packages
        shell: pwsh
        run: scripts/package-all.ps1 -Version $env:VERSION -Commit $env:BUILD_COMMIT -BuildDate $env:BUILD_DATE -Dirty false
      - name: SHA-256 checksums
        run: (cd dist && sha256sum ./*.zip > checksums.txt)
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/release.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign checksum manifest
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: release-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Upload to the reviewed Release Please release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
