name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauge-python:
    name: Gauge ${{ matrix.gauge }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - gauge: 1.6.22
            python: '3.10'
            skip_allure: 'true'
          - gauge: 1.6.35
            python: '3.14'
            skip_allure: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: test/e2e/gauge-python/projects/main/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: getgauge/setup-gauge@159e01e975eeae8bd1a097017590fefbc36e2d4e # audited 2026-08-07
        with:
          gauge-version: ${{ matrix.gauge }}
      - name: Run native reporter E2E and generator conformance
        env:
          SKIP_ALLURE: ${{ matrix.skip_allure }}
        run: sh scripts/test-e2e.sh python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        if: failure()
        with:
          name: e2e-diagnostics-gauge-${{ matrix.gauge }}-python-${{ matrix.python }}
          path: .tools/e2e/
          include-hidden-files: true
          if-no-files-found: warn
