name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - name: Markdown style
        run: npx --yes markdownlint-cli2@0.23.2 '**/*.md' '#.tools/**' '#tools/allure/node_modules/**'
      - name: Workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - name: JSON and YAML syntax
        run: go run ./build/validatefiles
      - name: Shell lint
        run: shellcheck scripts/*.sh
      - name: PowerShell lint
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $Findings = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error
          $Findings | Format-Table
          if ($Findings) { exit 1 }
      - name: Configuration and example syntax
        run: |
          go run ./cmd/allure-report validate-config examples/allure-report.yaml
          sh scripts/validate-examples.sh
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml '**/*.md'
          fail: true
