name: Nightly compatibility

on:
  schedule:
    - cron: '17 2 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.runner }} / Gauge ${{ matrix.gauge }} / ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            gauge: 1.6.22
            python: '3.10'
            language: python
          - runner: macos-15
            gauge: 1.6.35
            python: '3.14'
            language: python
          - runner: windows-latest
            gauge: 1.6.35
            python: '3.14'
            language: python
          - runner: ubuntu-latest
            gauge: 1.6.35
            python: '3.14'
            language: js
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - uses: getgauge/setup-gauge@159e01e975eeae8bd1a097017590fefbc36e2d4e # audited 2026-08-07
        with:
          gauge-version: ${{ matrix.gauge }}
      - name: Unix compatibility E2E
        if: runner.os != 'Windows'
        env:
          SKIP_ALLURE: 'true'
        run: sh scripts/test-e2e.sh '${{ matrix.language }}'
      - name: Windows compatibility E2E
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-e2e.ps1 -Runner '${{ matrix.language }}' -PythonCommand (Get-Command python).Source -SkipAllure
      - name: Reconciliation stress loop
        if: matrix.language == 'python'
        run: go test -count=25 -run TestConcurrentStreamingAndFinalReconciliation ./internal/collector
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: failure()
        with:
          name: nightly-diagnostics-${{ matrix.runner }}-${{ matrix.language }}
          path: .tools/e2e/
          include-hidden-files: true
          if-no-files-found: warn
